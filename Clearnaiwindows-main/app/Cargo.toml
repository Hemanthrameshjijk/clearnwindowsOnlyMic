[package]
name = "clearnai-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clearnairt"
path = "src/main.rs"

[dependencies]
# Portable foundation crate (bypass toggles, ring buffers, metrics). Builds
# and its unit tests run on every platform.
dsp-core = { path = "../crates/dsp-core" }

# DSP stages. All of these are portable Rust (no OS calls) except bvc-hush,
# which dynamically loads a Windows DLL at runtime via `libloading` - the
# crate itself still *builds* on Linux (the DLL load just fails at runtime
# with a clean `HushLoadError`, which is exactly the "unavailable" path this
# app is required to handle honestly rather than crash on).
studio-dsp = { path = "../crates/studio-dsp" }
noise-engine = { path = "../crates/noise-engine" }
bvc-hush = { path = "../crates/bvc-hush" }

# Real Windows audio I/O (WASAPI). Most of this crate's actual logic is
# gated `#![cfg(windows)]` file-by-file; this app only calls into it from
# code that is itself `#[cfg(windows)]`-gated (see src/engine.rs).
audio-io = { path = "../crates/audio-io" }

# User-mode side of the future ClearNAI virtual audio driver's transport -
# see `docs/DRIVER_PLAN.md`. Only the mic pipeline writes into it today;
# nothing reads from it yet (no driver exists) - this is deliberately built
# and wired ahead of the driver itself, so that half of the boundary is
# real and tested before the harder kernel-mode half is attempted.
driver-transport = { path = "../crates/driver-transport" }

# Speaker-reference-enrollment subsystem (see docs/TSE_ENROLLMENT.md):
# `speaker-profile` is the portable target-speaker-profile data type plus
# the lock-free store the realtime TSE stage reads from; `enrollment` is the
# non-realtime recording/VAD/encoder-calling state machine; `tse-engine` is
# the BVC backend-selection router (Off/Hush/TSE) plus the TSE backend
# trait and its `dsp_core::Stage` adapter. None of these are Windows-only -
# they build and test natively on any platform, same as `dsp-core` itself.
speaker-profile = { path = "../crates/speaker-profile" }
speaker-encoder = { path = "../crates/speaker-encoder" }
enrollment = { path = "../crates/enrollment" }
tse-engine = { path = "../crates/tse-engine" }

# Real BSRNN-based streaming TSE backend (REAL-TSE/WeSep spk_emb_causal_100,
# verified in poc/real_tse/ before this port - see that directory's
# README.md/results.md for the real measurements, and tse-bsrnn's own crate
# docs for what's verified vs. known-not-yet-fixed, particularly its
# real-time performance gap).
tse-bsrnn = { path = "../crates/tse-bsrnn" }

# Vanta (Conv-TasNet + ECAPA-TDNN) target-speaker-extraction backend - see
# that crate's docs for full honest status (real trained weights, but a
# genuinely weak model; ECAPA runtime needs onnxruntime.dll shipped
# alongside the app).
bvc-vanta = { path = "../crates/bvc-vanta" }

# Real-time accent conversion (Indian -> American English), ONNX Runtime based. Runs on its own worker thread;
# the mic pipeline only exchanges samples with it through two lock-free rings (see that crate's `pipeline` docs).
accent-onnx = { path = "../crates/accent-onnx" }
asr-onnx = { path = "../crates/asr-onnx" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GUI. Current major version confirmed against docs.rs/crates.io on
# 2026-09-11 (see docs/VIRTUAL_DEVICES.md / the report for citations): 0.14.0,
# using the `iced::application(boot, update, view)` builder API (the older
# `Application` trait/`Sandbox` API from pre-0.13 iced no longer exists).
# The `tokio` feature is required for `iced::time::every`, which drives the
# ~250ms status/level-meter poll.
iced = { version = "0.14", features = ["tokio"] }

# NOTE: the earlier `ureq` dependency for a first-run BVC model download has
# been removed - both `weya_nc.dll` and the ONNX model bundle are now
# embedded directly into this binary via `include_bytes!` (see
# `app/assets/` and `setup.rs::ensure_bvc_assets_extracted`) and
# self-extracted into `%LOCALAPPDATA%\ClearNAI` at launch, with no network
# access involved at all.

[dev-dependencies]
# Only for the `analyze_wav` diagnostic example - not part of the product
# binary, does not affect `clearnairt.exe`'s own dependency set.
hound = "3.5"
# Only for the `fbank_verify` diagnostic example.
kaldi-native-fbank = "0.1"

[target.'cfg(windows)'.dependencies]
# Only needed for `setup.rs`'s real Windows compatibility checks:
# `RtlGetVersion` (via the `Wdk_System_SystemServices` feature) and a direct
# `wasapi::initialize_mta()` COM-init probe, matching the exact `windows`/
# `wasapi` versions already pulled in transitively by `audio-io` (see
# `crates/audio-io/Cargo.toml`) to avoid duplicate incompatible versions.
windows = { version = "0.62", features = ["Wdk_System_SystemServices", "Wdk_Foundation", "Win32_System_SystemInformation"] }
wasapi = "0.24"
