[workspace]
resolver = "2"
members = [
    "crates/dsp-core",
    "crates/studio-dsp",
    "crates/noise-engine",
    "crates/bvc-hush",
    "crates/audio-io",
    "crates/aec",
    "crates/driver-transport",
    "crates/tse-engine",
    "crates/accent-onnx",
    "crates/asr-onnx",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

# Real-time audio cannot run unoptimised: in a plain debug build the accent model's pre/post-processing is too slow,
# the accent stage reports "CPU too slow" and pauses itself. Optimise every dependency and the audio crates (the
# GUI crate itself stays a fast-compiling debug build).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.aec]
opt-level = 3
[profile.dev.package.dsp-core]
opt-level = 3
[profile.dev.package.audio-io]
opt-level = 3
[profile.dev.package.accent-onnx]
opt-level = 3
[profile.dev.package.asr-onnx]
opt-level = 3
[profile.dev.package.bvc-hush]
opt-level = 3
[profile.dev.package.noise-engine]
opt-level = 3
[profile.dev.package.studio-dsp]
opt-level = 3
[profile.dev.package.tse-engine]
opt-level = 3
