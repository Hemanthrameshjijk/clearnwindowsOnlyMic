[package]
name = "speaker-encoder"
version.workspace = true
edition.workspace = true

[dependencies]
speaker-profile = { path = "../speaker-profile" }

# NOT the same tract-onnx version `noise-engine`'s `deep_filter` dependency
# resolves to (0.19.16) - that version's shape/type-inference engine was
# verified (by actually building and running a throwaway probe binary
# against the bundled model, not assumed) to fail on this model's dynamic-
# shape `Reduce<Prod>` statistics-pooling op ("Output mismatch after
# rewiring expansion for output #0: expected TDim got I64").
#
# 0.21.18 was verified the same way (real probe, real inference run, real
# output checked for shape/finiteness) to actually load and run this model
# correctly - but 0.21.18's `tract-data` pins `half = "=2.4.1"` (an *exact*
# version), which made `cargo` refuse to resolve the workspace at all once
# this crate became a dependency of `app` (which also depends on `iced`,
# whose `wgpu`/`naga` chain needs `half ^2.5`) - a real, reproducible
# resolver deadlock, not a hypothetical one.
#
# 0.23.7 relaxes that to `half = ">=2.4,<3.0"` (checked directly against its
# real `Cargo.toml`), which resolves cleanly alongside `iced`. Re-verified
# (not assumed) that the bundled model still loads/runs identically under
# 0.23.7 - the same probe produced byte-identical output values against
# this exact file under both 0.21.18 and 0.23.7.
tract-onnx = "0.23.7"

# Pure-Rust port of Kaldi's `kaldi-native-fbank` - used to compute the exact
# Kaldi-style log-mel filterbank features the bundled WeSpeaker ResNet34
# model expects (verified against sherpa-onnx's own `FeatureExtractorConfig`
# defaults and this crate's actual `MelBanks`/`FbankComputer` source - see
# `fbank.rs`'s docs for the specific parameters and how they were confirmed).
kaldi-native-fbank = "0.1"

# Already present in this workspace's dependency tree (pulled in
# transitively) at this exact version - used here to resample enrollment's
# 48kHz capture down to the 16kHz this model actually operates at. Resampling
# happens only in this crate's non-realtime `embed()` call, never in the
# live mic pipeline - see `speaker_profile::SpeakerEncoder::embed`'s docs.
rubato = "0.14"

[dev-dependencies]
# Only for one test verifying an ordinary sine tone is a stable input (no
# NaN/panics) - not part of the product binary.
